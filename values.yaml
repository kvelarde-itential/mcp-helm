---
# Default values for mcp.

replicaCount: 1

# applicationPort The port the MCP server container listens on inside the pod.
# Must match env.ITENTIAL_MCP_SERVER_PORT.
applicationPort: 8000

# image The Itential MCP image to use, its version, and its location
image:
  repository: ghcr.io/itential/itential-mcp
  pullPolicy: IfNotPresent
  tag: ""

# imagePullSecrets The secrets object used to pull the image from the repo
imagePullSecrets: []

# serviceAccount with IRSA
serviceAccount:
  name: ""

deployment:
  enabled: true

podAnnotations: {}
podLabels: {}
securityContext: {}
podSecurityContext: {}

# service The Kubernetes service object for this application
service:
  # type The service type
  type: "ClusterIP"
  # name The name of this Kubernetes service object
  name: "mcp-service"
  # port The port that this service object is listening on
  port: 8000

# ingress The Kubernetes ingress object for this application.
ingress:
  # enabled The ingress object can be disabled and will not be created with this set to false
  enabled: false
  # name The name of this Kubernetes ingress object
  name: "mcp-ingress"
  # className The ingress controller class name
  className: ""
  # annotations The annotations for this ingress object. These are passed into the template
  # as is and will render the contents as you see here.
  annotations:
  # hosts The list of hosts for this ingress and their associated properties
  hosts:
    - host: "mcp.example.com"
      paths:
        - path: "/"
          pathType: "Prefix"
  tls: []

resourcesEnabled: true
resources:
  limits:
    cpu: "500m"
    memory: "256Mi"
  requests:
    cpu: "250m"
    memory: "128Mi"

# The liveness probe used to determine if the container is alive. If the liveness probe fails,
# the kubelet kills the container, and the container is subjected to its restart policy. If a
# container does not provide a liveness probe, the default state is Success. These are suggested
# values.
livenessProbe:
  enabled: false
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
  path: "/mcp"

# The readiness probe used to determine if the container is ready to accept requests. If the
# readiness probe fails, the endpoints controller removes the pod's IP address from the
# endpoints of all services that match the pod. The default state of readiness before the
# initial delay is failure. If a container does not provide a readiness probe, the default
# state is success. These are suggested values.
readinessProbe:
  enabled: false
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
  path: "/mcp"

# The startup probe used to allow some time for the application to start up. The application
# will have a maximum of 3 minutes (18 * 10 = 180s) to finish its startup. Once the startup
# probe has succeeded once, the liveness probe takes over. These are suggested values.
startupProbe:
  enabled: false
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 18
  successThreshold: 1
  path: "/mcp"

# env Non-sensitive environment variables passed to the MCP container. Keys must be valid
# ITENTIAL_MCP_* environment variable names. See the full list at:
# https://github.com/itential/itential-mcp/blob/devel/src/itential_mcp/config/models.py
env:
  # ITENTIAL_MCP_SERVER_TRANSPORT Must be "sse" or "http" for Kubernetes deployments. Do not use "stdio".
  ITENTIAL_MCP_SERVER_TRANSPORT: "sse"
  # ITENTIAL_MCP_SERVER_HOST The address the MCP server binds to inside the container.
  ITENTIAL_MCP_SERVER_HOST: "0.0.0.0"
  # ITENTIAL_MCP_SERVER_PORT The port the MCP server listens on. Must match applicationPort.
  ITENTIAL_MCP_SERVER_PORT: "8000"
  # ITENTIAL_MCP_SERVER_PATH The HTTP path the MCP server mounts on.
  ITENTIAL_MCP_SERVER_PATH: "/mcp"
  # ITENTIAL_MCP_PLATFORM_HOST The hostname or IP address of the Itential Platform instance.
  ITENTIAL_MCP_PLATFORM_HOST: ""
  # ITENTIAL_MCP_PLATFORM_PORT The port of the Itential Platform instance.
  ITENTIAL_MCP_PLATFORM_PORT: "3443"
  # ITENTIAL_MCP_PLATFORM_DISABLE_TLS Set to "true" to disable TLS entirely (connects via HTTP).
  # Only use if Itential Platform is not running TLS. For self-signed or internal CA certs,
  # use ITENTIAL_MCP_PLATFORM_DISABLE_VERIFY instead.
  ITENTIAL_MCP_PLATFORM_DISABLE_TLS: "false"
  # ITENTIAL_MCP_PLATFORM_DISABLE_VERIFY Set to "true" to skip TLS certificate verification.
  # Use when Itential Platform uses a self-signed or internal CA certificate.
  ITENTIAL_MCP_PLATFORM_DISABLE_VERIFY: "false"
  # ITENTIAL_MCP_PLATFORM_TIMEOUT Connection timeout in seconds.
  ITENTIAL_MCP_PLATFORM_TIMEOUT: "30"
  # ITENTIAL_MCP_PLATFORM_TTL Authentication TTL in seconds before forcing reauthentication.
  # Set to a value shorter than the Itential Platform token lifetime to avoid stale token errors.
  # 0 disables forced reauthentication.
  ITENTIAL_MCP_PLATFORM_TTL: "0"

# credentials Platform authentication credentials. Sensitive values are stored in a Kubernetes
# Secret. Supports basic auth (user/password) or OAuth 2.0 (clientId/clientSecret).
credentials:
  # secretName If set, an existing Secret with this name is used and no new Secret is created.
  # The existing Secret must contain the relevant ITENTIAL_MCP_PLATFORM_* keys.
  secretName: ""
  # The following values are only used when secretName is empty.
  platformUser: ""
  platformPassword: ""
  platformClientId: ""
  platformClientSecret: ""

# volumes Additional volumes on the output Deployment definition.
volumes: []

# volumeMounts Additional volumeMounts on the output Deployment definition.
volumeMounts: []

nodeSelector:
  itential.io/app: "mcp"

tolerations:
  - effect: "NoSchedule"
    key: "itential.io/role"
    operator: "Equal"
    value: "mcp"

affinity: {}
