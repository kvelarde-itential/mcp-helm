suite: test ingress template
templates:
  - ingress.yaml
tests:
  - it: should not render ingress when disabled
    set:
      ingress:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0

  - it: should render ingress when enabled
    set:
      ingress:
        enabled: true
        name: mcp-ingress
        className: nginx
        hosts:
          - host: mcp.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
      - isAPIVersion:
          of: networking.k8s.io/v1

  - it: should set correct ingress name
    set:
      ingress:
        enabled: true
        name: custom-mcp-ingress
        className: nginx
        hosts:
          - host: mcp.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - equal:
          path: metadata.name
          value: custom-mcp-ingress

  - it: should set ingress class name
    set:
      ingress:
        enabled: true
        name: mcp-ingress
        className: nginx
        hosts:
          - host: mcp.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - equal:
          path: spec.ingressClassName
          value: nginx

  - it: should configure ingress host and path
    set:
      service:
        name: mcp-service
        port: 8000
      ingress:
        enabled: true
        name: mcp-ingress
        className: nginx
        hosts:
          - host: mcp.example.com
            paths:
              - path: /mcp
                pathType: Prefix
    asserts:
      - equal:
          path: spec.rules[0].host
          value: mcp.example.com
      - equal:
          path: spec.rules[0].http.paths[0].path
          value: /mcp
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.name
          value: mcp-service
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.number
          value: 8000

  - it: should configure TLS
    set:
      ingress:
        enabled: true
        name: mcp-ingress
        className: nginx
        hosts:
          - host: mcp.example.com
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - mcp.example.com
            secretName: mcp-tls-secret
    asserts:
      - equal:
          path: spec.tls[0].hosts[0]
          value: mcp.example.com
      - equal:
          path: spec.tls[0].secretName
          value: mcp-tls-secret

  - it: should set ingress labels
    set:
      ingress:
        enabled: true
        name: mcp-ingress
        className: nginx
        hosts:
          - host: mcp.example.com
            paths:
              - path: /
                pathType: Prefix
    asserts:
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: mcp
